<script>

window.__LOGS = [];
['log','info','warn','error'].forEach(k=>{
  const orig = console[k].bind(console);
  console[k] = (...a)=>{ try{ window.__LOGS.push([k, a.map(x=>{ try{ return typeof x==='string'?x:JSON.stringify(x).slice(0,300); }catch{ return String(x); } }).join(' ')]); }catch{} orig(...a); };
});
window.onerror = (m,s,l,c)=>{ window.__LOGS.push(['pageerror', m+' @'+(s||'')+':'+l]); };

【战报】
⚔️竞技场 挑战 我方:[杜根·布莱索] vs 敌方:[霜血九头蛇]

      // 空壳标签 + 真内容混在战报外：验证最短有效长度兜底
      return `<构筑推演></构筑推演>
<战斗推演></战斗推演>
杜根·布莱索：精英Lv11 HP148/148 防御19，位阶+2/×1.5。霜血九头蛇按描述生成：史诗顶峰Lv16，HP620，防御20，机制九头再生（一轮内未同时斩落九头则下轮全恢复），弱火。战力对比：孤盾难以单轮破解再生，胜负手在碎甲叠防与集火节奏。先攻预估：杜根 17 vs 蛇 12。

【第1轮】
| 状态变更: 霜血九头蛇 HP 620 -> 605 |

【敌方数据卡·照搬自描述生成】

神话位魔王第一阶段具备碾压性的各项数值。本场对局的唯一悬念在于奥姆尼斯如何处理史诗巨兽的"极速再生"机制。
