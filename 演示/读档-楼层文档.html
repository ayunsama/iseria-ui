<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
body{font-family:"Microsoft YaHei";margin:6px;font-size:13px;}
[data-iz-savebar]{border:1px dashed #8b6b4a;padding:6px;margin:6px 0;}
[data-iz-savebar] button{padding:2px 8px;cursor:pointer;}
</style></head><body>
<div id="tag" style="font-size:11px;color:#888;"></div>
<div id="barbox"></div>
<div id="stubbox"></div>
<script>
(function(){
  var q = {}; location.search.replace(/^\?/, '').split('&').forEach(function(kv){ var p = kv.split('='); q[p[0]] = p[1] || ''; });
  var floor = parseInt(q.floor, 10) || 0;
  document.getElementById('tag').textContent = '（楼层文档 · mesid=' + floor + (q.stub ? ' · 含状态栏stub' : ' · 无stub=老楼层') + '）';
  var bar = document.createElement('div');
  bar.setAttribute('mesid', String(floor));
  bar.setAttribute('data-iz-savebar', '');
  bar.innerHTML = '⏳ 时空存档：<button data-iz-save="1">存1</button><button data-iz-load="1">读1</button><button data-iz-save="2">存2</button><button data-iz-load="2">读2</button><button data-iz-save="3">存3</button><button data-iz-load="3">读3</button> <span data-iz-info style="color:#888;">存1:空　存2:空　存3:空</span>';
  document.getElementById('barbox').appendChild(bar);
  if (q.stub) {
    var f = document.createElement('iframe');
    f.style.cssText = 'width:95%;height:64px;border:1px solid #ccc;';
    f.srcdoc = '<html><head><meta charset="UTF-8"></head><body style="font-family:Microsoft YaHei;font-size:12px;margin:4px;">状态栏 stub（运行读档补丁）<scr' + 'ipt>' + "\r\n    /* ============================================================\r\n       时空存档·读档补丁（正文渲染器按钮排交互）\r\n       按钮由卡内正则（正文美化暗色）渲染：data-iz-save / data-iz-load / data-iz-info\r\n       楼层号从点击处最近的 [mesid]/[message_id]/[mes] DOM 祖先解析。\r\n       存档数据存聊天变量 isuria_save_slots（type:'chat'，分聊天隔离）：\r\n       { \"1\": {floor:12, date:\"圣光历1497年3月4日\", snippet:\"...\"}, ... }\r\n       读档 = 删除存档楼之后的所有楼层并刷新（等效回档）。\r\n       幂等：window.__isuriaSavePatch 标记，只安装一次。\r\n       ============================================================ */\r\n    (function () {\r\n        try {\r\n            // 幂等按【文档】算而不是按 window 算：酒馆助手更新楼层会重写消息 iframe 的 document，\r\n            // 旧文档上的监听器随之销毁；新文档没有 __isuriaSavePatchDoc 标记，周期扫描会自动重装（自愈）。\r\n            function install(win) {\r\n                try {\r\n                    if (!win || !win.document || !win.document.addEventListener) return;\r\n                    var doc = win.document;\r\n                    if (doc.__isuriaSavePatchDoc) return;\r\n                    doc.__isuriaSavePatchDoc = true;\r\n                    function TH() { return (win.TavernHelper) || (win.parent && win.parent.TavernHelper) || (win.top && win.top.TavernHelper) || null; }\r\n                    function floorOf(el) {\r\n                        while (el && el !== doc.body) {\r\n                            var m = el.getAttribute && (el.getAttribute('mesid') || el.getAttribute('message_id') || el.getAttribute('mes'));\r\n                            if (m !== null && m !== undefined && m !== '') { var n = parseInt(m, 10); if (!isNaN(n)) return n; }\r\n                            el = el.parentNode;\r\n                        }\r\n                        return null;\r\n                    }\r\n                    function getSlots(cb) {\r\n                        var th = TH(); if (!th || !th.getVariables) { cb({}); return; }\r\n                        th.getVariables({ type: 'chat' }).then(function (v) { cb(v && v.isuria_save_slots ? v.isuria_save_slots : {}); }).catch(function () { cb({}); });\r\n                    }\r\n                    function setSlots(slots, cb) {\r\n                        var th = TH(); if (!th || !th.insertOrAssignVariables) { cb && cb(false); return; }\r\n                        th.insertOrAssignVariables({ isuria_save_slots: slots }, { type: 'chat' }).then(function () { cb && cb(true); }).catch(function () { cb && cb(false); });\r\n                    }\r\n                    function dateOfFloor(floor) {\r\n                        try {\r\n                            var th = TH();\r\n                            var ctx = th && th.getChatMessages ? th.getChatMessages(floor) : null;\r\n                            var mes = ctx && ctx.message ? String(ctx.message) : '';\r\n                            var m = mes.match(/圣光历\\d+年(?:\\s*\\d+月)?(?:\\s*\\d+日)?/);\r\n                            return m ? m[0] : '';\r\n                        } catch (e) { return ''; }\r\n                    }\r\n                    function refreshInfo() {\r\n                        var boxes = doc.querySelectorAll('[data-iz-savebar]');\r\n                        if (!boxes.length) return;\r\n                        getSlots(function (slots) {\r\n                            for (var i = 0; i < boxes.length; i++) {\r\n                                var box = boxes[i];\r\n                                var msg = box.closest ? box.closest('[mesid],[message_id],[mes]') : null;\r\n                                var spans = box.querySelectorAll('[data-iz-info]');\r\n                                for (var s = 0; s < spans.length; s++) {\r\n                                    var parts = [];\r\n                                    for (var k = 1; k <= 3; k++) {\r\n                                        var sl = slots[k];\r\n                                        parts.push('存' + k + ':' + (sl ? ('楼' + sl.floor + (sl.date ? '·' + sl.date : '')) : '空'));\r\n                                    }\r\n                                    spans[s].textContent = parts.join('　');\r\n                                }\r\n                                var btns = box.querySelectorAll('[data-iz-load]');\r\n                                for (var b = 0; b < btns.length; b++) {\r\n                                    var sl2 = slots[btns[b].getAttribute('data-iz-load')];\r\n                                    btns[b].style.opacity = sl2 ? '1' : '.45';\r\n                                }\r\n                            }\r\n                        });\r\n                    }\r\n                    // ★ 捕获阶段委托：即使正文渲染器内部 stopPropagation 也拦不住\r\n                    doc.addEventListener('click', function (ev) {\r\n                        var t = ev.target;\r\n                        while (t && t !== doc.body && !(t.getAttribute && (t.getAttribute('data-iz-save') || t.getAttribute('data-iz-load')))) t = t.parentNode;\r\n                        if (!t || t === doc.body) return;\r\n                        var th = TH();\r\n                        if (!th) { if (win.console && win.console.warn) win.console.warn('[时空存档] 未找到 TavernHelper 接口，读档按钮不可用'); return; }\r\n                        var bar = t.closest ? t.closest('[data-iz-savebar]') : null;\r\n                        var floor = floorOf(bar || t);\r\n                        if (floor === null) { alert('未能定位当前楼层'); return; }\r\n                        var sv = t.getAttribute('data-iz-save');\r\n                        if (sv) {\r\n                            getSlots(function (slots) {\r\n                                var slotsNow = slots || {};\r\n                                slotsNow[sv] = { floor: floor, date: dateOfFloor(floor), snippet: '' };\r\n                                setSlots(slotsNow, function (okr) {\r\n                                    if (okr !== false) { if (th.toastr) th.toastr.success('已存档：楼' + floor, '时空存档'); refreshInfo(); }\r\n                                    else if (th.toastr) th.toastr.error('存档失败', '时空存档');\r\n                                });\r\n                            });\r\n                            return;\r\n                        }\r\n                        var ld = t.getAttribute('data-iz-load');\r\n                        if (ld) {\r\n                            getSlots(function (slots) {\r\n                                var sl = slots && slots[ld];\r\n                                if (!sl || sl.floor === undefined) { if (th.toastr) th.toastr.info('该存档槽为空', '时空存档'); return; }\r\n                                var latest = th.getLastMessageId ? th.getLastMessageId() : null;\r\n                                if (latest === null || latest <= sl.floor) { if (th.toastr) th.toastr.info('当前已在存档点或更早，无需读档', '时空存档'); return; }\r\n                                if (!win.confirm('读档将回溯到 第' + sl.floor + '楼' + (sl.date ? '（' + sl.date + '）' : '') + '，其后的所有剧情将被删除。确定吗？')) return;\r\n                                var ids = []; for (var f2 = sl.floor + 1; f2 <= latest; f2++) ids.push(f2);\r\n                                th.deleteChatMessages(ids).then(function () {\r\n                                    if (th.toastr) th.toastr.success('已回溯到 第' + sl.floor + '楼', '时空存档');\r\n                                }).catch(function (e2) { if (th.toastr) th.toastr.error('读档失败: ' + (e2 && e2.message || e2), '时空存档'); });\r\n                            });\r\n                        }\r\n                    }, true);\r\n                    setInterval(function () {\r\n                        // 文档被替换（楼层重渲染）后此定时器随旧文档闲置，自清防止堆积\r\n                        try { if (doc.defaultView === null) { clearInterval(this); return; } } catch (e) {}\r\n                        refreshInfo();\r\n                    }, 3000);\r\n                    setTimeout(refreshInfo, 800);\r\n                    // ★ 防御性样式：正文渲染器若给按钮排误设 pointer-events:none / 缺手型，这里强制恢复\r\n                    try {\r\n                        var st = doc.createElement('style');\r\n                        st.textContent = '[data-iz-savebar],[data-iz-savebar] *{pointer-events:auto !important;}[data-iz-savebar] [data-iz-save],[data-iz-savebar] [data-iz-load]{cursor:pointer !important;}';\r\n                        (doc.head || doc.documentElement).appendChild(st);\r\n                    } catch (e) {}\r\n                } catch (e) { console.warn('[时空存档补丁] 安装失败:', e); }\r\n            }\r\n            // ★ 全树扫描：状态栏只活在最新楼层，旧楼层的存档按钮排靠把补丁装进所有可达的同源 iframe 文档来覆盖\r\n            function installAll(win) {\r\n                try {\r\n                    if (!win) return;\r\n                    install(win);\r\n                    var docs = [];\r\n                    try { if (win.parent && win.parent.document) docs.push(win.parent.document); } catch (e) {}\r\n                    try { if (win.top && win.top.document && win.top.document !== win.parent.document) docs.push(win.top.document); } catch (e) {}\r\n                    for (var d = 0; d < docs.length; d++) {\r\n                        try {\r\n                            install(docs[d].defaultView);\r\n                            var frames = docs[d].querySelectorAll('iframe');\r\n                            for (var i = 0; i < frames.length; i++) {\r\n                                try { if (frames[i].contentWindow) install(frames[i].contentWindow); } catch (e) {}\r\n                            }\r\n                        } catch (e) {}\r\n                    }\r\n                } catch (e) { console.warn('[时空存档补丁] 扫描安装失败:', e); }\r\n            }\r\n            try { installAll(window); } catch (e) {}\r\n            // 楼层 iframe 随消息更新/新增不断重建：周期重扫（幂等按文档标记，重复扫描开销可忽略）\r\n            setInterval(function () { try { installAll(window); } catch (e) {} }, 1500);\r\n        } catch (e) { console.warn('[时空存档补丁] 外层异常:', e); }\r\n    })();\r\n    " + '</scr' + 'ipt></body></html>';
    document.getElementById('stubbox').appendChild(f);
  }
})();
</script>
</body></html>
